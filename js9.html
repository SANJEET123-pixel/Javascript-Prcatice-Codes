<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divide numbers</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Enter 1st number: "));
        let b = parseInt(prompt("Enter 2nd number: "));
        alert("Division : " +(a/b));
    </script>
</body>
</html>
