<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age</title>
</head>
<body>
    <script>
        let age1 = parseInt(prompt("Enter the age of first person: "));
        let age2 = parseInt(prompt("Enter the age of second person: "));
        alert("First person is older than second person: " + (age1>age2));
    </script>
</body>
