<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <script>
        let a = Number(prompt("Enter 1st number: "));
        let b = Number(prompt("Enter 2nd number: "));
        alert("Greater than : " +(a>b));
        alert("Less than : " +(a<b));
        alert("Greater than or equal to : " +(a>=b));
        alert("Less than or equal to : " +(a<=b));

    </script>
</body>
</html>
