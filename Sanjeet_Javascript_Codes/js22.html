<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd_Even</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Enter a number: "));
        if(a%2==0)
        alert("Even")
        else
        alert("Odd")

    </script>
</body>
</html>
