<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perimeter of Rectangle</title>
</head>
<body>
    <script>
       let len = parseFloat(prompt("Enter length: "));
       let br = parseFloat(prompt("Enter breadth: "));
       alert("Perimeter of rectangle is : " +2*(len+br));
    </script>
</body>
</html>
