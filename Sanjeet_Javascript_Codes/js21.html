<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiply Function</title>
</head>
<body>
    <script>
        function multiply(){
        let a = parseInt(prompt("Enter 1st number: "));
        let b = parseInt(prompt("Enter 2nd number: "));
        alert("Multiplication : " +(a*b));
        }
        multiply();
    </script>
</body>
</html>
